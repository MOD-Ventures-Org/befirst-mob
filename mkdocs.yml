site_name: BeFirst Pose Module — Technical White Paper
site_description: Architecture, engineering history, operations, and technical direction for the BeFirst on-device pose-tracking module.
repo_url: https://github.com/usmanthesuper/befirst-mob
repo_name: usmanthesuper/befirst-mob
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

nav:
  - White Paper: index.md
  - Context & Capabilities: context-and-capabilities.md
  - System Architecture: architecture.md
  - Data Flows & Workflows: workflows.md
  - Engineering Evolution: engineering-history.md
  - Technology & Data: technology-and-data.md
  - Operations & Quality: operations.md
  - Decisions & Trade-offs: decisions.md
  - Limitations & Roadmap: limitations-and-roadmap.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

copyright: Technical white paper — repository state reviewed 11 August 2026
